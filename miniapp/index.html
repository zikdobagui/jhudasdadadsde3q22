<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>Ramon Store</title>
  <link rel="stylesheet" href="styles.css?v=20260825-snow">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- grade de linhas estilo SquareCloud -->
  <div class="grid-bg" aria-hidden="true"></div>
  <!-- neve animada -->
  <canvas id="snow-canvas" aria-hidden="true"></canvas>
  <header class="topbar">
    <div>
      <strong>RAMON STORE</strong>
      <span>Catálogo digital</span>
    </div>
    <button class="cart-button" id="cartButton" type="button" aria-label="Abrir carrinho">
      <span aria-hidden="true">🛒</span>
      <b id="cartCount">0</b>
    </button>
  </header>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <img src="assets/store-banner.png" alt="Celular, controle remoto e cartões digitais">
      <div class="hero-copy">
        <p>ENTREGA PELO BOT</p>
        <h1 id="heroTitle">Escolha. Adicione. Finalize.</h1>
        <span>Seu saldo e o estoque serão confirmados antes da compra.</span>
      </div>
    </section>

    <section class="tools" aria-label="Filtros do catálogo">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar produto" autocomplete="off">
      </label>
      <div class="segments" id="segments">
        <button class="active" data-filter="todos" type="button">Todos</button>
        <button data-filter="conta" type="button">Contas</button>
        <button data-filter="tela" type="button">Telas</button>
        <button data-filter="outros" type="button">Outros</button>
      </div>
    </section>

    <section class="catalog-heading">
      <div>
        <h2>Produtos disponíveis</h2>
        <p id="resultCount"></p>
      </div>
      <span class="secure">✓ Compra verificada</span>
    </section>

    <section class="product-list" id="productList" aria-live="polite"></section>
  </main>

  <aside class="cart-sheet" id="cartSheet" aria-hidden="true">
    <button class="scrim" id="closeCart" type="button" aria-label="Fechar carrinho"></button>
    <section class="sheet-panel" aria-labelledby="cartTitle">
      <div class="sheet-handle"></div>
      <header>
        <div>
          <p>SEU PEDIDO</p>
          <h2 id="cartTitle">Carrinho</h2>
        </div>
        <button class="icon-button" id="closeCartIcon" type="button" aria-label="Fechar">×</button>
      </header>
      <div class="cart-items" id="cartItems"></div>
      <footer>
        <div class="total"><span>Total estimado</span><strong id="cartTotal">R$ 0,00</strong></div>
        <button class="checkout" id="checkoutButton" type="button">Enviar carrinho ao bot</button>
        <p>Preço, saldo e disponibilidade serão validados no Telegram.</p>
      </footer>
    </section>
  </aside>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=20260825-snow"></script>
  <script>
    /* ── Neve animada ── */
    (function () {
      const canvas = document.getElementById('snow-canvas');
      const ctx    = canvas.getContext('2d');
      let W, H, flakes = [];
      const COUNT = 120;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function randomFlake() {
        return {
          x:       Math.random() * W,
          y:       Math.random() * H - H,
          r:       Math.random() * 2.2 + 0.8,   /* raio 0.8–3 px  */
          speed:   Math.random() * 0.8 + 0.3,   /* velocidade de queda */
          drift:   (Math.random() - 0.5) * 0.4, /* balanço lateral */
          opacity: Math.random() * 0.55 + 0.15, /* levemente transparente */
          angle:   Math.random() * Math.PI * 2,
          angleV:  (Math.random() - 0.5) * 0.01
        };
      }

      function init() {
        resize();
        flakes = Array.from({ length: COUNT }, randomFlake);
        /* distribui pelo ecrã logo de início */
        flakes.forEach(f => { f.y = Math.random() * H; });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const f of flakes) {
          ctx.save();
          ctx.globalAlpha = f.opacity;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#7dd3b8';
          ctx.shadowBlur  = 4;
          ctx.fill();
          ctx.restore();

          /* movimento */
          f.angle += f.angleV;
          f.x     += f.drift + Math.sin(f.angle) * 0.3;
          f.y     += f.speed;

          /* reaparecer no topo quando sair pela base */
          if (f.y > H + 10) {
            f.y = -10;
            f.x = Math.random() * W;
          }
          /* wrap lateral */
          if (f.x > W + 10) f.x = -10;
          if (f.x < -10)    f.x =  W + 10;
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      init();
      draw();
    })();
  </script>
</body>
</html>
